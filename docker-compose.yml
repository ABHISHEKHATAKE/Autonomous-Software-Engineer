services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ase}
      POSTGRES_USER: ${POSTGRES_USER:-ase}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ase_dev_password}
    volumes:
      - ase-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    image: ase-backend:local
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-ase}:${POSTGRES_PASSWORD:-ase_dev_password}@postgres:5432/${POSTGRES_DB:-ase}
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      EXECUTION_IMAGE: ${EXECUTION_IMAGE:-ase-backend:local}
      EXECUTION_NETWORK: ${EXECUTION_NETWORK:-none}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/github/oauth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  ase-postgres-data:
