services:
  backend:
    build:
      context: ./backend
    image: ase-backend:local
    ports:
      - '8000:8000'
    environment:
      DATABASE_URL: sqlite:////data/ase.db
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-me}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_MODEL: ${GROQ_MODEL:-qwen/qwen3.8-27b}
      EXECUTION_IMAGE: ${EXECUTION_IMAGE:-ase-backend:local}
      EXECUTION_NETWORK: ${EXECUTION_NETWORK:-none}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_REDIRECT_URI: ${GITHUB_REDIRECT_URI:-http://localhost:8000/api/v1/github/oauth/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - ase-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
    ports:
      - '5173:5173'
    environment:
      VITE_API_URL: http://localhost:8000/api/v1
    command: npm run dev -- --host 0.0.0.0
    depends_on:
      - backend

volumes:
  ase-data:
